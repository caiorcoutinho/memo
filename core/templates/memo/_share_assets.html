{% comment %}Estilos e script do autocomplete de compartilhamento.{% endcomment %}
<style>
  .share-title {
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 1rem; font-weight: 600; color: var(--ink); margin-bottom: 0.35rem;
  }
  .share-title .ico { color: var(--ink-faint); }
  .share-group { margin-bottom: 1rem; }
  .share-group-label {
    display: block; font-size: 0.8125rem; font-weight: 550;
    color: var(--ink-soft); margin-bottom: 0.4rem;
  }
  .chip-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .chip {
    display: inline-flex; align-items: center; gap: 0.2rem;
    padding: 0.25rem 0.25rem 0.25rem 0.6rem;
    background: var(--surface-sunk);
    border: 1px solid var(--rule);
    border-radius: var(--r-ctl);
    font-size: 0.875rem;
  }
  .chip form { margin: 0; display: flex; }
  .chip-x {
    display: flex; align-items: center; justify-content: center;
    width: 1.35rem; height: 1.35rem; padding: 0; border: none;
    border-radius: 3px; background: transparent; color: var(--ink-faint);
    font-size: 1.05rem; line-height: 1; cursor: pointer;
  }
  .chip-x:hover { color: var(--danger); background: var(--paper); }
  .chip-empty { font-family: var(--annot); font-style: italic; font-size: 0.875rem; color: var(--ink-faint); }
  .share-search { position: relative; margin-top: 0.25rem; }
  .share-input { width: 100%; }
  .share-results {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20;
    /* Antes apontava para --card, que não existe: o menu ficava transparente. */
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: var(--r-ctl);
    overflow: hidden;
    box-shadow: var(--lift-high);
  }
  .share-result {
    display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
    padding: 0.5rem 0.6rem 0.5rem 0.75rem; font-size: 0.9375rem;
  }
  .share-result + .share-result { border-top: 1px solid var(--rule); }
  .share-result-acts { display: flex; gap: 0.35rem; }
  .share-result-acts .btn { padding: 0.3rem 0.6rem; font-size: 0.8125rem; }
  .share-none {
    padding: 0.7rem 0.75rem; font-size: 0.875rem; color: var(--ink-faint);
    font-family: var(--annot); font-style: italic;
  }
</style>
<script>
(function () {
  document.querySelectorAll('.share-search:not([data-bound])').forEach(function (box) {
    box.setAttribute('data-bound', '1');
    const input = box.querySelector('.share-input');
    const results = box.querySelector('.share-results');
    const searchUrl = box.dataset.searchUrl;
    const actionUrl = box.dataset.actionUrl;
    const withRoles = box.dataset.roles === '1';
    const csrf = box.dataset.csrf;
    let timer;

    function hidden(name, value) {
      const i = document.createElement('input');
      i.type = 'hidden'; i.name = name; i.value = value;
      return i;
    }

    function submitShare(role, userId) {
      const f = document.createElement('form');
      f.method = 'post'; f.action = actionUrl;
      f.appendChild(hidden('csrfmiddlewaretoken', csrf));
      f.appendChild(hidden('action', 'add'));
      if (role) f.appendChild(hidden('role', role));
      f.appendChild(hidden('user', userId));
      document.body.appendChild(f);
      f.submit();
    }

    function makeBtn(label, role, userId) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn btn-solid'; b.textContent = label;
      b.addEventListener('click', function () { submitShare(role, userId); });
      return b;
    }

    function render(items) {
      results.innerHTML = '';
      if (!items.length) {
        results.innerHTML = '<div class="share-none">nenhum usuário encontrado</div>';
        results.hidden = false;
        return;
      }
      items.forEach(function (u) {
        const row = document.createElement('div');
        row.className = 'share-result';
        const name = document.createElement('span');
        name.textContent = u.username;
        row.appendChild(name);
        const acts = document.createElement('span');
        acts.className = 'share-result-acts';
        if (withRoles) {
          acts.appendChild(makeBtn('visualizar', 'view', u.id));
          acts.appendChild(makeBtn('editar', 'edit', u.id));
        } else {
          acts.appendChild(makeBtn('adicionar', null, u.id));
        }
        row.appendChild(acts);
        results.appendChild(row);
      });
      results.hidden = false;
    }

    input.addEventListener('input', function () {
      clearTimeout(timer);
      const q = input.value.trim();
      if (!q) { results.hidden = true; results.innerHTML = ''; return; }
      timer = setTimeout(function () {
        fetch(searchUrl + '?q=' + encodeURIComponent(q))
          .then(function (r) { return r.json(); })
          .then(function (data) { render(data.results || []); })
          .catch(function () { results.hidden = true; });
      }, 200);
    });

    document.addEventListener('click', function (e) {
      if (!box.contains(e.target)) { results.hidden = true; }
    });
  });
})();
</script>
