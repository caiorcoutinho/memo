{% comment %}Estilos e script do autocomplete de compartilhamento.{% endcomment %}
<style>
  .share-group { margin-bottom: 0.9rem; }
  .share-group-label { display:block; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.04em; opacity:0.75; margin-bottom:0.4rem; }
  .chip-list { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:0.5rem; }
  .chip { display:inline-flex; align-items:center; gap:0.4rem; padding:0.3rem 0.3rem 0.3rem 0.7rem;
          background:var(--card-border); border-radius:999px; font-size:0.9rem; }
  .chip form { margin:0; }
  .chip-x { width:1.4rem; height:1.4rem; line-height:1; padding:0; border:none; border-radius:50%;
            background:transparent; color:var(--text); font-size:1.1rem; cursor:pointer; opacity:0.7; }
  .chip-x:hover { opacity:1; background:rgba(0,0,0,0.15); }
  .chip-empty { font-size:0.9rem; opacity:0.6; font-style:italic; }
  .share-search { position:relative; margin-top:0.25rem; }
  .share-input { width:100%; }
  .share-results { position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:20;
                   background:var(--card); border:1px solid var(--card-border); border-radius:12px;
                   overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.25); }
  .share-result { display:flex; align-items:center; justify-content:space-between; gap:0.5rem;
                  padding:0.5rem 0.75rem; }
  .share-result + .share-result { border-top:1px solid var(--card-border); }
  .share-result-acts { display:flex; gap:0.4rem; }
  .share-result-acts .btn { padding:0.25rem 0.6rem; font-size:0.85rem; }
  .share-none { padding:0.6rem 0.75rem; opacity:0.7; font-size:0.9rem; }
</style>
<script>
(function () {
  document.querySelectorAll('.share-search:not([data-bound])').forEach(function (box) {
    box.setAttribute('data-bound', '1');
    const input = box.querySelector('.share-input');
    const results = box.querySelector('.share-results');
    const searchUrl = box.dataset.searchUrl;
    const actionUrl = box.dataset.actionUrl;
    const withRoles = box.dataset.roles === '1';
    const csrf = box.dataset.csrf;
    let timer;

    function hidden(name, value) {
      const i = document.createElement('input');
      i.type = 'hidden'; i.name = name; i.value = value;
      return i;
    }

    function submitShare(role, userId) {
      const f = document.createElement('form');
      f.method = 'post'; f.action = actionUrl;
      f.appendChild(hidden('csrfmiddlewaretoken', csrf));
      f.appendChild(hidden('action', 'add'));
      if (role) f.appendChild(hidden('role', role));
      f.appendChild(hidden('user', userId));
      document.body.appendChild(f);
      f.submit();
    }

    function makeBtn(label, role, userId) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn btn-solid'; b.textContent = label;
      b.addEventListener('click', function () { submitShare(role, userId); });
      return b;
    }

    function render(items) {
      results.innerHTML = '';
      if (!items.length) {
        results.innerHTML = '<div class="share-none">nenhum usuário encontrado</div>';
        results.hidden = false;
        return;
      }
      items.forEach(function (u) {
        const row = document.createElement('div');
        row.className = 'share-result';
        const name = document.createElement('span');
        name.textContent = u.username;
        row.appendChild(name);
        const acts = document.createElement('span');
        acts.className = 'share-result-acts';
        if (withRoles) {
          acts.appendChild(makeBtn('visualizar', 'view', u.id));
          acts.appendChild(makeBtn('editar', 'edit', u.id));
        } else {
          acts.appendChild(makeBtn('adicionar', null, u.id));
        }
        row.appendChild(acts);
        results.appendChild(row);
      });
      results.hidden = false;
    }

    input.addEventListener('input', function () {
      clearTimeout(timer);
      const q = input.value.trim();
      if (!q) { results.hidden = true; results.innerHTML = ''; return; }
      timer = setTimeout(function () {
        fetch(searchUrl + '?q=' + encodeURIComponent(q))
          .then(function (r) { return r.json(); })
          .then(function (data) { render(data.results || []); })
          .catch(function () { results.hidden = true; });
      }, 200);
    });

    document.addEventListener('click', function (e) {
      if (!box.contains(e.target)) { results.hidden = true; }
    });
  });
})();
</script>
