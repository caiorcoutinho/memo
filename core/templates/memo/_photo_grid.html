{# Grid de fotos estilo Pinterest. Espera a variável `photos`. #}
<div class="masonry">
  {% for photo in photos %}
    <a href="{{ photo.get_absolute_url }}" class="card">
      <img src="{{ photo.image.url }}" alt="{{ photo.name }}" loading="lazy" />
      <div class="card-body">
        <div class="card-title">{{ photo.name }}</div>
        <div class="card-meta">
          {{ photo.taken_at|date:"d/m/Y" }}{% if show_memo and photo.memo %} · {{ photo.memo.name }}{% endif %}
        </div>
      </div>
    </a>
  {% endfor %}
</div>
